# xiao_caliper: console/shell on the UART header (see xiao_caliper.overlay).

# Do not bring up the USB stack / CDC ACM console the board enables by default.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# LOG_INF output: prj.conf only enables the RTT backend, and the shell log
# backend is off.  Send logs through the shell on the UART, at INF level.
# (Do not also enable LOG_BACKEND_UART: it would fight the shell for uart0.)
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_LEVEL_INF=y
